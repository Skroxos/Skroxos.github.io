<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adam Krčil | Unity Software Engineer</title>
    <style>
        :root {
            --bg: #080e14;
            --surface: #0d1822;
            --surface2: #112030;
            --accent: #38bdf8;
            --accent2: #7dd3fc;
            --accent3: #0ea5e9;
            --text: #e2eaf2;
            --muted: #64849e;
            --border: #1a3045;
        }

        * { box-sizing: border-box; }

        html { scroll-behavior: smooth; }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--muted);
            line-height: 1.7;
            overflow-x: hidden;
        }

        h1, h2, h3 { color: var(--text); margin: 0; }
        a { text-decoration: none; }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 40px;
        }

        /* ── NAV ── */
        nav {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 60px;
            background: rgba(8,14,20,0.85);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--border);
        }

        .nav-name {
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--accent);
        }

        .nav-links {
            display: flex;
            gap: 36px;
            list-style: none;
            margin: 0; padding: 0;
        }

        .nav-links a {
            color: var(--muted);
            font-size: 0.8rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            transition: color 0.2s;
            cursor: pointer;
        }

        .nav-links a:hover { color: var(--text); }

        /* ── HERO ── */
        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 100px 40px 80px;
            border-bottom: 1px solid var(--border);
            position: relative;
            overflow: hidden;
        }

        .hero-bg {
            position: absolute;
            inset: 0;
            background:
                radial-gradient(ellipse 90% 60% at 50% 0%, rgba(14,165,233,0.1) 0%, transparent 65%),
                radial-gradient(ellipse 50% 40% at 15% 80%, rgba(56,189,248,0.05) 0%, transparent 60%),
                radial-gradient(ellipse 40% 30% at 85% 70%, rgba(125,211,252,0.04) 0%, transparent 55%);
            animation: heroShift 12s ease-in-out infinite alternate;
        }

        @keyframes heroShift {
            0%   { opacity: 0.7; transform: scale(1) translateY(0); }
            100% { opacity: 1;   transform: scale(1.06) translateY(-10px); }
        }

        .hero > * { position: relative; z-index: 1; }

        .hero h1 {
            font-size: clamp(3rem, 8vw, 5.5rem);
            letter-spacing: -3px;
            margin-bottom: 8px;
            background: linear-gradient(160deg, var(--text) 35%, var(--accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero-location {
            font-size: 0.78rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--muted);
            opacity: 0.6;
            margin-bottom: 20px;
        }

        .hero h2 {
            font-size: 1.35rem;
            color: var(--accent);
            font-weight: 400;
            margin-bottom: 28px;
            letter-spacing: 0.02em;
        }

            font-size: 1.05rem;
            max-width: 560px;
            margin-bottom: 44px;
            color: var(--muted);
            line-height: 1.75
